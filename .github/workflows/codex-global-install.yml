name: One-time global Codex install

on:
  push:
    paths:
      - .github/workflows/codex-global-install.yml

permissions:
  contents: write

jobs:
  install-codex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Codex globally
        run: npm install -g @openai/codex

      - name: Verify Codex
        run: codex --version

      - name: Remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/codex-global-install.yml
          git commit -m "chore: remove one-time Codex global install workflow"
          git push
