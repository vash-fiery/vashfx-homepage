name: One-time workerd install

on:
  push:
    paths:
      - .github/workflows/workerd-install.yml

permissions:
  contents: write

jobs:
  install-workerd:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workerd
        run: npm i workerd

      - name: Commit dependency update and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/workerd-install.yml
          git commit -m "chore: install workerd"
          git push
