name: One-time Codex dev dependency update

on:
  push:
    paths:
      - .github/workflows/codex-dev-install.yml

permissions:
  contents: write

jobs:
  update-codex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install latest Codex as a dev dependency
        run: npm install -D @openai/codex@latest

      - name: Commit dependency update and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/codex-dev-install.yml
          git commit -m "chore: update Codex dev dependency"
          git push
