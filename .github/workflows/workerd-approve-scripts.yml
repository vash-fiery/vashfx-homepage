name: One-time approve workerd scripts

on:
  push:
    paths:
      - .github/workflows/workerd-approve-scripts.yml

permissions:
  contents: write

jobs:
  approve-workerd:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies without running scripts
        run: npm ci --ignore-scripts

      - name: Approve workerd scripts
        run: npm approve-scripts workerd

      - name: Commit approval and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/workerd-approve-scripts.yml
          git commit -m "chore: approve workerd scripts"
          git push
