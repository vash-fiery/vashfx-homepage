name: One-time global npm update

on:
  push:
    paths:
      - .github/workflows/npm-global-update-once.yml

permissions:
  contents: write

jobs:
  update-npm-global:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install latest npm globally
        run: |
          npm i -g npm@latest
          npm -v

      - name: Remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/npm-global-update-once.yml
          git commit -m "chore: remove one-time global npm update workflow"
          git push
