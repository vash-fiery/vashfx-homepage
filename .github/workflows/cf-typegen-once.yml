name: One-time Cloudflare type generation

on:
  push:
    paths:
      - .github/workflows/cf-typegen-once.yml

permissions:
  contents: write

jobs:
  cf-typegen:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run cf-typegen, commit output, and clean up
        shell: bash
        run: |
          set +e
          npm run cf-typegen
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/cf-typegen-once.yml

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          elif [ "$status" -eq 0 ]; then
            git commit -m "chore: regenerate Cloudflare types"
            git push
          else
            git commit -m "chore: remove one-time cf-typegen workflow"
            git push
          fi

          exit "$status"
