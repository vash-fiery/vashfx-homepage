name: "Deploy Cloudflare Worker"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  build:
    name: Build with Node${{ matrix.node_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [22, 24, 26]
        #include:
          # Active LTS + other OS
          #- os: macos-latest
            #node_version: 24
          #- os: windows-latest
            #node_version: 24
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Use Node${{ matrix.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: dist-node-${{ matrix.node_version }}
          path: dist/
          if-no-files-found: ignore

  deploy:
    name: Deploy with Node26
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy with Wrangler
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: dist-deploy
          path: dist/
          if-no-files-found: ignore
