name: "Deploy Cloudflare Worker"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    name: Build with Node${{ matrix.node_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [26]
        #include:
          # Active LTS + other OS
          #- os: macos-latest
            #node_version: 24
          #- os: windows-latest
            #node_version: 24
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Use Node${{ matrix.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        run: npm run lint

      - name: Build
        run: npm run build --if-present

      - name: Deploy with Wrangler
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
