name: "CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: ["24.x.x", "26.x.x"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Use Node ${{ matrix.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare types
        run: npm run cf-typegen

      - name: Show generated type diff
        run: git diff -- worker-configuration.d.ts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: dist-node-${{ matrix.node_version }}
          path: dist/*
          if-no-files-found: ignore
