name: "Validate Cloudflare Worker"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Node${{ matrix.node_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [22, 24, 26]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Use Node${{ matrix.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check Worker types
        if: matrix.node_version == 24
        run: npx wrangler types --check

      - name: Build
        run: npm run build

      - name: Validate Worker bundle
        if: matrix.node_version == 24
        run: npx wrangler deploy --dry-run

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: dist-node-${{ matrix.node_version }}
          path: dist/
          if-no-files-found: ignore
