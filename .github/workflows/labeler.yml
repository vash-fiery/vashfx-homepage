name: "Label Pull Requests"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  labeler:
    runs-on: ubuntu-26

    steps:
    - name: Labeler
      uses: actions/checkout@v7 # Uploads repository content to the runner
      with:
        repository: "vash-fiery/vashfx-homepage" # The one of the available inputs, visit https://github.com/actions/checkout#readme to find more

    - name: Labeler
      uses: actions/labeler@v7.0.0
      with:
        dot: true
        repo-token: ${{ github.token }}
        configuration-path: '.github/labeler.yml'
