name: "Label Pull Requests"

on:
  pull_request:
    branches:
    - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  labeler:
    runs-on: ['ubuntu-26.04']

    steps:
    # No checkout: actions/labeler reads the configuration through the API,
    # so PR-head files are never placed on the runner.
    - name: Labeler
      uses: actions/labeler@v7.0.0
      with:
        dot: true
        repo-token: ${{ github.token }}
        configuration-path: '.github/labeler.yml'
