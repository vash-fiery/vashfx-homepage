name: One-time npm dev dependency update

on:
  push:
    paths:
      - .github/workflows/npm-dev-install.yml

permissions:
  contents: write

jobs:
  update-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install latest npm as a dev dependency
        run: npm i -D npm@latest

      - name: Commit dependency update and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/npm-dev-install.yml
          git commit -m "chore: add latest npm dev dependency"
          git push
