name: One-time workerd dev dependency update

on:
  push:
    paths:
      - .github/workflows/workerd-dev-install.yml

permissions:
  contents: write

jobs:
  update-workerd:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workerd as a dev dependency
        run: npm i -D workerd

      - name: Remove stale allowed-scripts entry
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          if (pkg.allowScripts) {
            delete pkg.allowScripts['workerd@1.20260820.1']
            if (Object.keys(pkg.allowScripts).length === 0) delete pkg.allowScripts
          }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')
          NODE

      - name: Commit dependency update and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/workerd-dev-install.yml
          git commit -m "chore: move workerd to dev dependency"
          git push
