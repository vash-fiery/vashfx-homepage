# Rules for actions/labeler (see .github/workflows/labeler.yml).
# Head-branch patterns are regular expressions; file patterns are globs.

# Add 'bug' to PRs from fix branches, e.g. `fix/...`, `hotfix-...`, `claude/fix-...`
bug:
  - head-branch: ['^(bug|hot)?fix', '/(bug|hot)?fix']

documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'docs/**']

frontend:
  - changed-files:
      - any-glob-to-any-file: 'src/**'

backend:
  - changed-files:
      - any-glob-to-any-file: 'worker/**'

tests:
  - changed-files:
      - any-glob-to-any-file: ['tests/**', '**/*.test.ts']

dependencies:
  - changed-files:
      - any-glob-to-any-file: ['package.json', 'package-lock.json']

# Add 'feature' to PRs whose head branch starts with `feature` or has a `/feature` section, e.g. `claude/feature-x`
feature:
  - head-branch: ['^feature', '/feature']

# Add 'release' to PRs from release branches, e.g. `release/1.2.0`
release:
  - head-branch: ['^release']
